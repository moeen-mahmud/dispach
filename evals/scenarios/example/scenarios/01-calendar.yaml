name: calendar-today
description: Reads the calendar and reports only what is on it.
steps:
  - prompt: What's on my calendar today?
    expected_calls:
      - slug: calendar_list_events
    mocks:
      calendar_list_events:
        events:
          - { start: "10:00", end: "10:15", title: "Standup" }
          - { start: "15:30", end: "16:30", title: "Dentist" }
    criteria:
      - Mentions the standup at 10:00
      - Mentions the dentist at 15:30
      - Does not mention any event other than the standup and the dentist
