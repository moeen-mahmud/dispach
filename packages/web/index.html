<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!--
            An inline SVG data URI rather than a file, and that is a constraint rather than a
            flourish: the server embeds these assets as *text* (decision 11.200), so a binary
            favicon would be the one thing in the build that could not ride inside the bundle.
        -->
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0c'/%3E%3Cpath d='M9 8h7a8 8 0 0 1 0 16H9z' fill='none' stroke='%23e8e6e3' stroke-width='2.5'/%3E%3C/svg%3E"
        />
        <title>Dispach</title>
        <!--
            No title text beyond the brand. The page sets `document.title` from the agent it is
            actually talking to once it knows, because a tab saying "Dispach" next to three others
            saying "Dispach" is a tab nobody can find.
        -->
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
