name: Feature request
description: Something Dispach should do that it does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        A new manifest field, event, route or dependency changes a published contract, so it is discussed before it is built. `docs/00-DECISIONS.md` lists what has been decided against and why; check it first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The change as you see it. A sketch of the config or API helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you tried, or other ways to get there.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
          required: false
