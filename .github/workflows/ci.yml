name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Everything here blocks a merge.
  bun:
    runs-on: ubuntu-latest
    # A job with no bound is a job that can burn the six-hour ceiling on a hang, twice a day,
    # and report nothing anybody reads until somebody notices the bill. Green is under two
    # minutes; anything past this is a hang rather than a slow runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Cheapest first, so a lint error does not wait on a build. This is the only step that can
      # come before one.
      - name: lint
        run: bun run lint

      # `build` is second, and the ordering is load-bearing rather than tidy. Every sibling import
      # resolves through that package's `dist/` — so on a fresh checkout, which has none, both
      # `typecheck` and `test` fail with 79 `TS2307: Cannot find module '@dispach/core'` and 34
      # `Cannot find module` test errors respectively. Locally they pass on the strength of a
      # `dist/` left behind by an earlier build, which is why this was invisible for nine days of
      # red runs: the failure is a property of the checkout, not of the change.
      - name: build
        run: bun run build

      - name: typecheck
        run: bun run typecheck

      # Hard rule 2 — core imports nothing from a sibling and depends on nothing outside its
      # allowlist. The reason this repo can claim core is lightweight.
      - name: dependency boundary
        run: bun run check:deps

      - name: test
        run: bun test

      # Checked every phase, not just at the end. A regression is cheap to fix the day it
      # appears and expensive to bisect for a month later.
      - name: boot budget
        run: bun run bench:boot -- --ci

  # The image, built and measured where a daemon exists.
  #
  # A blocking job rather than `continue-on-error`, unlike the Node leg: the Dockerfile is a shipped
  # artifact and a broken one is broken for everybody who reaches for it, where a Node divergence is
  # information about a soft goal. It is also the only place this gets verified at all — the
  # Dockerfile was written on a machine with no Docker daemon running, so until this job runs, the
  # size and start-to-ready figures Phase 11 asks for are unmeasured rather than met.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: build image
        run: docker build -f docker/Dockerfile -t dispach:ci .

      # Reported either way, because "how big is it" is a question somebody asks long before it
      # fails a threshold.
      #
      # **The ceiling, renegotiated twice in one day and each time with the measurement attached.**
      # 150 MB (Phase 11) → 350 (15.4, when the image actually shipping measured 287 and the gate
      # had been red since the browser surface landed) → 700 (15.5, on the base-image change).
      #
      # Measured on arm64 at 15.5, by layer, because "it got bigger" is not a finding:
      #
      #   debian:trixie-slim          109 MB
      #   apt packages                180 MB   ← of which `git` alone is 92
      #   uv + uvx                     47 MB
      #   the compiled binary          85 MB
      #   ────────────────────────────────────
      #                               570 MB
      #
      # `git` at 92 MB is the price of glibc: Debian's git pulls perl and git-man, where alpine's
      # is a fraction of that. It buys prebuilt Python wheels, which is the trade 15.5.1 argues —
      # musl has no compiler here, so a wheel without a `musllinux` build is a *failure* inside a
      # tool call rather than a slow install.
      #
      # 700 is a ceiling, not a target, and the stated position is that the image carries
      # everything an agent needs. The known trims, in order and each with a cost: drop `uvx`
      # (-23 MB, `uv run` is the documented path); remove perl after installing git (-~60 MB, and
      # `git add -i`/`send-email` stop working); drop `python3` and let `uv` fetch its own (-37 MB,
      # and the first Python tool call becomes a download).
      - name: image size
        run: |
          bytes=$(docker image inspect dispach:ci --format '{{.Size}}')
          mb=$(( bytes / 1000000 ))
          echo "image is ${mb} MB"
          if [ "$mb" -gt 700 ]; then
            echo "::error::image is ${mb} MB, over the 700 MB ceiling"
            exit 1
          fi

      # What the agent's shell can reach. Asserted, because the absence of `git` does not degrade
      # the skills catalogue — it deletes it, and the symptom is `git: not found` inside somebody
      # else's container. A slimming change to the base image would otherwise take a shipped
      # feature with it silently.
      - name: the shell the agent gets
        run: |
          missing=""
          for tool in sh bash git python3 curl jq uv dispach; do
            docker run --rm --entrypoint sh dispach:ci -c "command -v $tool >/dev/null" \
              || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::absent from the image:$missing — see docker/Dockerfile for why each is there"
            exit 1
          fi
          echo "toolchain present"

          # **Absent on purpose, and asserted.** Since 15.5 the runtime stage has no Bun and no
          # Node: the application is one compiled binary, which is what deletes the runtime
          # `bun install` — and with it the ~17 MB of `react-devtools-core` that `--production`
          # could not skip, because `ink` declares it a peerDependency. A change that reintroduced
          # either would quietly restore that cost, so it fails here instead.
          #
          # No pager and no editor either: `exec` hands a child a file descriptor and never a TTY,
          # so anything that pages or prompts blocks until `deadlineMs` and reads as a hung agent.
          present=""
          for tool in bun node less nano vi; do
            docker run --rm --entrypoint sh dispach:ci -c "command -v $tool >/dev/null" \
              && present="$present $tool"
          done
          if [ -n "$present" ]; then
            echo "::error::these should not be in the image:$present"
            exit 1
          fi
          echo "no runtime, no pager, no editor"

          # glibc, which is the whole reason the base image changed. A revert to musl passes every
          # test above and then fails inside a tool call, on a machine nobody is watching.
          docker run --rm --entrypoint sh dispach:ci -c 'ldd --version 2>&1 | head -1' | grep -qi glibc \
            || { echo "::error::the image is not glibc — a Python wheel without a musllinux build will try to compile, and there is no compiler"; exit 1; }

          # A C-extension wheel, with no compiler present. The payoff measured rather than argued.
          docker run --rm --entrypoint sh dispach:ci -c '
            command -v cc gcc >/dev/null && exit 9
            uv pip install --quiet --system --break-system-packages --target /tmp/w msgpack >/dev/null 2>&1 || exit 1
            python3 -c "import sys; sys.path.insert(0, \"/tmp/w\"); import msgpack" ' \
            || { echo "::error::a prebuilt C-extension wheel did not install and import"; exit 1; }
          echo "wheels install with no compiler"

          # `tzdata`, for schedules. `zone.ts` walks local calendar fields through Intl, and with no
          # zone database a cron silently runs in UTC — the failure the DST handling exists to stop.
          docker run --rm --entrypoint sh dispach:ci -c 'TZ=Asia/Dhaka date +%z' | grep -q '+0600' \
            || { echo "::error::a named timezone does not resolve — schedules would silently run in UTC"; exit 1; }
          echo "named timezones resolve"

          # Non-root is the other half, and it is what the containment in docker-compose.yml
          # assumes. A base-image change that reverted to root would make every cap_drop moot.
          uid=$(docker run --rm --entrypoint sh dispach:ci -c 'id -u')
          [ "$uid" = "1000" ] || { echo "::error::image runs as uid $uid, expected 1000"; exit 1; }
          echo "runs as uid 1000"

          # `$HOME` is load-bearing since 15.5: `lib/sandbox.ts` resolves `~/.dispach`, and `USER`
          # does **not** set `$HOME` in Docker — it is inherited from the build environment. Unset,
          # the sandbox lands under `/root`, which is writable while building and refused at run
          # time, so the failure arrives on the first turn rather than at start.
          home=$(docker run --rm --entrypoint sh dispach:ci -c 'echo $HOME')
          [ "$home" = "/home/dispach" ] || { echo "::error::HOME is '$home', expected /home/dispach"; exit 1; }
          echo "HOME is a real home"

      # Start to ready, the number the container claim is actually about. `minimal` needs only a
      # key-shaped string to load — nothing here calls an endpoint.
      #
      # No command override: the point is to exercise the image's own CMD, including the
      # `--host 0.0.0.0` without which a published port reaches nothing. The token is required by
      # that bind and is not a secret — the container is destroyed four lines later.
      - name: container start to ready
        run: |
          docker run -d --name probe -p 7420:7420 \
            -e MODEL_ID=gpt-4o-mini \
            -e MODEL_BASE_URL=https://api.openai.com/v1 \
            -e MODEL_API_KEY=ci-not-a-real-key \
            -e DISPACH_API_TOKEN=ci-not-a-real-token \
            -v "$PWD/examples/minimal:/agent" \
            dispach:ci
          start=$(date +%s%N)
          for _ in $(seq 1 100); do
            if curl -sf localhost:7420/v1/ready >/dev/null; then break; fi
            sleep 0.1
          done
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "start to ready: ${ms} ms"
          curl -sf localhost:7420/v1/ready || { docker logs probe; exit 1; }
          if [ "$ms" -gt 2000 ]; then
            echo "::error::start to ready was ${ms} ms, over the 2000 ms target"
            docker logs probe
            exit 1
          fi
          docker rm -f probe

      # **One agents directory, which is the defect 15.5 exists to fix.**
      #
      # It was two: `DISPACH_HOME=/state` put `init`'s output in `/state/agents` while the CMD served
      # `/agent`, so an agent created inside the container was invisible to every listing and nothing
      # would ever serve it. Found by using the container, not by reading it — and an earlier draft of
      # the plan wrote it up as a supported feature.
      #
      # The guard is a listing rather than a unit test, because the thing that was wrong was not a
      # function's return value: every piece worked and none of them was connected. Both halves below
      # fail on the pre-15.5 image.
      - name: one agents directory
        run: |
          set -e
          docker volume rm -f ci-home >/dev/null 2>&1 || true
          run() {
            docker run --rm \
              -v ci-home:/home/dispach \
              -v "$PWD/examples/minimal:/agent" \
              -e MODEL_ID=gpt-4o-mini \
              -e MODEL_BASE_URL=https://api.openai.com/v1 \
              -e MODEL_API_KEY=ci-not-a-real-key \
              dispach:ci "$@"
          }

          # The mounted manifest, reached by **bare ref** through the link the entrypoint makes —
          # the same `resolveAgentRef` path a laptop uses, rather than a second special path.
          run validate primary --plain | tee /tmp/v.txt
          grep -q "agents/primary/agent.yaml" /tmp/v.txt \
            || { echo "::error::the mounted agent is not reachable as 'primary' in the sandbox"; exit 1; }

          # An agent created *inside* the container has to land in the same directory.
          run init --yes --user ci --name probe \
            --model gpt-4o-mini --base-url https://api.openai.com/v1 | tail -3

          # …and both have to appear in one listing, after a fresh container on the same volume.
          run run --plain > /tmp/list.txt 2>&1 || true
          cat /tmp/list.txt
          grep -q "^primary" /tmp/list.txt || { echo "::error::the mounted agent is missing from the listing"; exit 1; }
          grep -q "^probe"   /tmp/list.txt || { echo "::error::the agent created in the container is missing from the listing"; exit 1; }
          echo "one directory, both agents, across container lifetimes"
          docker volume rm -f ci-home >/dev/null 2>&1 || true

      # The front door, exercised the way a reader of the README will. The step above proves the
      # *image*; this proves the compose file — which is where the traps are, because every one of
      # them is a default that produces a container which builds, starts and answers nothing.
      #
      # `config -q` first, and it is a real gate rather than a formality: it exits 1 on a missing
      # `:?` variable, so a compose file that has grown a required variable nobody sets fails here
      # instead of at somebody's `up`.
      #
      # Then `up -d --wait`, which waits on the image's own HEALTHCHECK — so this is also the only
      # thing that checks the healthcheck and the compose file agree. Dummy credentials for the
      # same reason as above: nothing calls an endpoint before readiness.
      - name: compose front door
        run: |
          cat > .env <<'ENV'
          DISPACH_API_TOKEN=ci-not-a-real-token
          MODEL_ID=gpt-4o-mini
          MODEL_BASE_URL=https://api.openai.com/v1
          MODEL_API_KEY=ci-not-a-real-key
          ENV
          docker compose config -q
          # The image is already built and tagged by the first step; retagging saves a rebuild.
          docker tag dispach:ci dispach:local
          docker compose up -d --wait || { docker compose logs; exit 1; }
          curl -sf localhost:7420/v1/ready || { docker compose logs; exit 1; }
          # The token is required, so an unauthenticated write must be refused — the property the
          # 0.0.0.0 bind depends on, checked rather than assumed.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"text":"hi"}' \
            localhost:7420/v1/agents/minimal/messages)
          if [ "$code" != "401" ]; then
            echo "::error::an unauthenticated POST returned ${code}, expected 401"
            docker compose logs
            exit 1
          fi
          docker compose down -v

  # The standalone binary, built and *run* on each platform that can run it.
  #
  # A blocking job, because `bun test` cannot see this class of failure at all: tests import source,
  # so a defect in how the program is bundled or signed is invisible to all 3,216 of them. The
  # recorded instance is `--splitting` emitting a duplicate export — green suite, unparseable
  # bundle. `--compile` is a second bundler shape with its own way to be wrong.
  #
  # The matrix is over *runners* rather than targets on purpose: each leg builds its own host target
  # and executes it, so every asset in the matrix is proven rather than merely produced. The two
  # cross-compiled legs (darwin-x64, linux-arm64) are built in the release workflow and cannot be
  # run anywhere here, which the script says out loud rather than implying.
  #
  # macOS is not optional cover. Bun emits a *linker-signed* ad-hoc signature that macOS kills on
  # exec — exit 137, no output — while `codesign -dv` reports the binary as signed, so the obvious
  # check passes on a dead file. Only running it catches that, and only a macOS runner can.
  binary:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    # **Required, and deleting it turns every step below red.** No committed example validates with
    # an empty environment, and that is the feature rather than a gap: `validate` refuses a manifest
    # whose key env vars are unset, because an unset variable expanding to an empty string surfaces
    # later as a confusing auth error. Measured on a fresh checkout — `minimal` and `team` fail
    # `env_var_missing @ model.main.id`, `reference` and `shell-agent` fail
    # `manifest_validation_failed @ model.main.apiKeyEnv`.
    #
    # The values are deliberately fake and nothing here reaches a network: `validate` loads and
    # checks, and `serve` binds loopback. Same shape and the same placeholders as the `docker` job
    # above, so the two cannot drift into disagreeing about what a CI environment looks like.
    #
    # This step was written and verified locally, where it passed — because `ambientEnv` layers the
    # **cwd's** `.env`, and the repo root had one. That is the recorded hazard twice over: verify a
    # workflow change against a fresh clone rather than against your working tree, and remember the
    # cwd's `.env` is a participating layer.
    env:
      MODEL_ID: gpt-4o-mini
      MODEL_BASE_URL: https://api.openai.com/v1
      MODEL_API_KEY: ci-not-a-real-key

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Required, not defensive: the CLI resolves every sibling package through its `dist/`, so on a
      # fresh checkout the compile fails on a directory that does not exist yet.
      - name: build
        run: bun run build

      - name: compile and run the host target
        run: bun run build:binary

      # Past `--version`, which the script already asserts. This is the shape that matters: a real
      # manifest through the whole loader, on the plain path, from a single file with no
      # `node_modules` anywhere near it.
      - name: the binary does real work
        run: |
          bin=$(ls dist-bin/dispach-*)
          echo "using $bin"
          "$bin" validate ./examples/minimal/agent.yaml --json | tee /tmp/out.json
          grep -q '"ok": true' /tmp/out.json || {
            echo "::error::the compiled binary could not validate the reference manifest"
            exit 1
          }
          "$bin" --help > /dev/null

      # The browser surface, from inside a single file.
      #
      # Decision 11.200 measured `with { type: "text" }` against source and bundled shapes;
      # `--compile` is a third, and it is the one the release ships. The assets are inlined into
      # the bundle, so if that stopped working here the failure would be a 500 from `/` on a
      # binary whose every other command was fine.
      - name: the binary serves the web UI
        run: |
          bin=$(ls dist-bin/dispach-*)
          export DISPACH_HOME="$(mktemp -d)"
          "$bin" serve ./examples/minimal/agent.yaml --port 7431 > /tmp/serve.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS localhost:7431/v1/ready > /dev/null 2>&1 && break
            sleep 1
          done
          for path in / /assets/app.js /assets/app.css; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "localhost:7431$path")
            bytes=$(wc -c < /tmp/body)
            echo "$path -> $code, $bytes bytes"
            if [ "$code" != "200" ] || [ "$bytes" -lt 100 ]; then
              echo "::error::$path answered $code with $bytes bytes from the compiled binary"
              cat /tmp/serve.log
              exit 1
            fi
          done
          kill %1

      # The lazy renderer boundary, checked in the one shape that can lose it. `--compile` resolves
      # static imports at build time, so a module that reached Ink statically would drag ~170-210 ms
      # of React into a command whose entire runtime is less than that — and nothing would fail.
      - name: no renderer on the plain path
        run: |
          bin=$(ls dist-bin/dispach-*)
          start=$(date +%s%N)
          "$bin" validate ./examples/minimal/agent.yaml --json > /dev/null
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "validate --json in ${ms} ms"
          if [ "$ms" -gt 600 ]; then
            echo "::error::${ms} ms for validate --json — something on this path now imports a renderer"
            exit 1
          fi

  # Decision 2.2 — Node is a soft goal, tested but never a blocker. A red leg here is information,
  # not a merge gate. The floor is 24 (decision 13.5): 22 bundles SQLite 3.51.3, whose planner turns
  # every memory query into a per-row probe of the FTS table — 260 ms against 0.7 ms. That is pinned
  # in the SQL now, but a runtime whose stdlib is a version behind on the one library this project
  # keeps its memory in is not a runtime worth carrying by default.
  #
  # A one-entry matrix on purpose: adding 26 is then one line, not a restructure.
  node:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: build
        run: bun run build
      # Proves the source tree stays importable by Node unbundled, which the `node --test` parity
      # below depends on.
      - name: node smoke
        run: node scripts/smoke-node.ts
      # The same suite `bun test` runs, under Node's runner. This is what actually proves the
      # SQLite adapter: bun:sqlite and node:sqlite differ in foreign-key defaults, miss values,
      # and parameter coercion, and only running both catches a divergence.
      #
      # Bounded twice over, and the second bound is not belt-and-braces. `test:node` carries
      # `--test-timeout`, which names a hanging test and lets the rest of the suite run — but only for
      # a test that yields. The hang this replaced was `mkdirSync(recursive)` spinning inside libuv,
      # which **blocks the event loop**, so no timer fires and no reporter runs: Node printed
      # `TAP version 13` and stopped dispatching, and thirteen of forty-four files silently never ran.
      # Only a wall clock outside the process catches that. Green is three to nine seconds.
      - name: test under node
        timeout-minutes: 5
        run: bun run test:node
