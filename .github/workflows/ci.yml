name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Everything here blocks a merge.
  bun:
    runs-on: ubuntu-latest
    # A job with no bound is a job that can burn the six-hour ceiling on a hang, twice a day,
    # and report nothing anybody reads until somebody notices the bill. Green is under two
    # minutes; anything past this is a hang rather than a slow runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Cheapest first, so a lint error does not wait on a build. This is the only step that can
      # come before one.
      - name: lint
        run: bun run lint

      # `build` is second, and the ordering is load-bearing rather than tidy. Every sibling import
      # resolves through that package's `dist/` — so on a fresh checkout, which has none, both
      # `typecheck` and `test` fail with 79 `TS2307: Cannot find module '@dispach/core'` and 34
      # `Cannot find module` test errors respectively. Locally they pass on the strength of a
      # `dist/` left behind by an earlier build, which is why this was invisible for nine days of
      # red runs: the failure is a property of the checkout, not of the change.
      - name: build
        run: bun run build

      - name: typecheck
        run: bun run typecheck

      # Hard rule 2 — core imports nothing from a sibling and depends on nothing outside its
      # allowlist. The reason this repo can claim core is lightweight.
      - name: dependency boundary
        run: bun run check:deps

      - name: test
        run: bun test

      # Checked every phase, not just at the end. A regression is cheap to fix the day it
      # appears and expensive to bisect for a month later.
      - name: boot budget
        run: bun run bench:boot -- --ci

  # The image, built and measured where a daemon exists.
  #
  # A blocking job rather than `continue-on-error`, unlike the Node leg: the Dockerfile is a shipped
  # artifact and a broken one is broken for everybody who reaches for it, where a Node divergence is
  # information about a soft goal. It is also the only place this gets verified at all — the
  # Dockerfile was written on a machine with no Docker daemon running, so until this job runs, the
  # size and start-to-ready figures Phase 11 asks for are unmeasured rather than met.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: build image
        run: docker build -f docker/Dockerfile -t dispach:ci .

      # Phase 11's target. Reported either way, because "how big is it" is a question somebody asks
      # long before it fails a threshold.
      - name: image size
        run: |
          bytes=$(docker image inspect dispach:ci --format '{{.Size}}')
          mb=$(( bytes / 1000000 ))
          echo "image is ${mb} MB"
          if [ "$mb" -gt 150 ]; then
            echo "::error::image is ${mb} MB, over the 150 MB target"
            exit 1
          fi

      # What the agent's shell can reach. Asserted, because the absence of `git` does not degrade
      # the skills catalogue — it deletes it, and the symptom is `git: not found` inside somebody
      # else's container. A slimming change to the base image would otherwise take a shipped
      # feature with it silently.
      - name: the shell the agent gets
        run: |
          missing=""
          for tool in sh bash git python3 curl wget node; do
            docker run --rm --entrypoint sh dispach:ci -c "command -v $tool >/dev/null" \
              || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::absent from the image:$missing — see docker/Dockerfile for why each is there"
            exit 1
          fi
          echo "toolchain present"
          # Non-root is the other half, and it is what the containment in docker-compose.yml
          # assumes. A base-image change that reverted to root would make every cap_drop moot.
          uid=$(docker run --rm --entrypoint sh dispach:ci -c 'id -u')
          [ "$uid" = "1000" ] || { echo "::error::image runs as uid $uid, expected 1000"; exit 1; }
          echo "runs as uid 1000"

      # Start to ready, the number the container claim is actually about. `minimal` needs only a
      # key-shaped string to load — nothing here calls an endpoint.
      #
      # No command override: the point is to exercise the image's own CMD, including the
      # `--host 0.0.0.0` without which a published port reaches nothing. The token is required by
      # that bind and is not a secret — the container is destroyed four lines later.
      - name: container start to ready
        run: |
          docker run -d --name probe -p 7420:7420 \
            -e MODEL_ID=gpt-4o-mini \
            -e MODEL_BASE_URL=https://api.openai.com/v1 \
            -e MODEL_API_KEY=ci-not-a-real-key \
            -e DISPACH_API_TOKEN=ci-not-a-real-token \
            -v "$PWD/examples/minimal:/agent" \
            dispach:ci
          start=$(date +%s%N)
          for _ in $(seq 1 100); do
            if curl -sf localhost:7420/v1/ready >/dev/null; then break; fi
            sleep 0.1
          done
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "start to ready: ${ms} ms"
          curl -sf localhost:7420/v1/ready || { docker logs probe; exit 1; }
          if [ "$ms" -gt 2000 ]; then
            echo "::error::start to ready was ${ms} ms, over the 2000 ms target"
            docker logs probe
            exit 1
          fi
          docker rm -f probe

      # The front door, exercised the way a reader of the README will. The step above proves the
      # *image*; this proves the compose file — which is where the traps are, because every one of
      # them is a default that produces a container which builds, starts and answers nothing.
      #
      # `config -q` first, and it is a real gate rather than a formality: it exits 1 on a missing
      # `:?` variable, so a compose file that has grown a required variable nobody sets fails here
      # instead of at somebody's `up`.
      #
      # Then `up -d --wait`, which waits on the image's own HEALTHCHECK — so this is also the only
      # thing that checks the healthcheck and the compose file agree. Dummy credentials for the
      # same reason as above: nothing calls an endpoint before readiness.
      - name: compose front door
        run: |
          cat > .env <<'ENV'
          DISPACH_API_TOKEN=ci-not-a-real-token
          MODEL_ID=gpt-4o-mini
          MODEL_BASE_URL=https://api.openai.com/v1
          MODEL_API_KEY=ci-not-a-real-key
          ENV
          docker compose config -q
          # The image is already built and tagged by the first step; retagging saves a rebuild.
          docker tag dispach:ci dispach:local
          docker compose up -d --wait || { docker compose logs; exit 1; }
          curl -sf localhost:7420/v1/ready || { docker compose logs; exit 1; }
          # The token is required, so an unauthenticated write must be refused — the property the
          # 0.0.0.0 bind depends on, checked rather than assumed.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"text":"hi"}' \
            localhost:7420/v1/agents/minimal/messages)
          if [ "$code" != "401" ]; then
            echo "::error::an unauthenticated POST returned ${code}, expected 401"
            docker compose logs
            exit 1
          fi
          docker compose down -v

  # Decision 2.2 — Node is a soft goal, tested but never a blocker. A red leg here is information,
  # not a merge gate. The floor is 24 (decision 13.5): 22 bundles SQLite 3.51.3, whose planner turns
  # every memory query into a per-row probe of the FTS table — 260 ms against 0.7 ms. That is pinned
  # in the SQL now, but a runtime whose stdlib is a version behind on the one library this project
  # keeps its memory in is not a runtime worth carrying by default.
  #
  # A one-entry matrix on purpose: adding 26 is then one line, not a restructure.
  node:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: build
        run: bun run build
      # Proves the source tree stays importable by Node unbundled, which the `node --test` parity
      # below depends on.
      - name: node smoke
        run: node scripts/smoke-node.ts
      # The same suite `bun test` runs, under Node's runner. This is what actually proves the
      # SQLite adapter: bun:sqlite and node:sqlite differ in foreign-key defaults, miss values,
      # and parameter coercion, and only running both catches a divergence.
      #
      # Bounded twice over, and the second bound is not belt-and-braces. `test:node` carries
      # `--test-timeout`, which names a hanging test and lets the rest of the suite run — but only for
      # a test that yields. The hang this replaced was `mkdirSync(recursive)` spinning inside libuv,
      # which **blocks the event loop**, so no timer fires and no reporter runs: Node printed
      # `TAP version 13` and stopped dispatching, and thirteen of forty-four files silently never ran.
      # Only a wall clock outside the process catches that. Green is three to nine seconds.
      - name: test under node
        timeout-minutes: 5
        run: bun run test:node
