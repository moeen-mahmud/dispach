name: release

# Tag-driven, and the tag is the only trigger. `bun run release <version>` writes the version into
# the three places that must agree and cuts the CHANGELOG section; a person reviews, commits and
# pushes `v<version>`. This workflow turns that tag into artefacts and publishes nothing on its own.
#
# Order: npm first, because the formula's URL and digest are of the tarball the registry serves;
# then the GitHub Release (notes from CHANGELOG.md), the tap commit and the image, in parallel.
on:
  push:
    tags: ["v*"]
  # Buildable without a tag so the pipeline can be proven before a release depends on it. A manual
  # run builds and verifies and touches neither the registry, the release, the tap nor GHCR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────────────────
  # The npm package — one name, `dispach`, carrying the CLI and the client.
  #
  # **Fails, rather than skips, when `NPM_TOKEN` is absent.** It used to skip with a note, on the
  # argument that a registry credential should not turn a release of binaries and an image red.
  # There are no binaries any more: the formula installs the npm tarball and the image is built from
  # the same tarball, so a release that did not publish to npm has published a formula pointing at
  # nothing. A green run that shipped nothing is hard rule 8.
  #
  # `verify:package` runs before publishing and is the real gate: it packs the tarball, installs it
  # into an empty directory and uses it the three documented ways — the bin, `import "dispach"`, and
  # `dispach/client`. Reading the bundle instead is not an option, because it is minified and a
  # regex for `from "x"` matches the word *from* inside a help string.
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `--provenance` needs `id-token: write`, and without it `npm publish` fails at the last
    # step with `EUSAGE — Provenance generation in GitHub Actions requires "write" access to the
    # "id-token" permission`. Provenance links the published tarball to this commit and this
    # workflow, verifiable by anyone on the package page.
    #
    # **`contents: read` is restated deliberately.** A job-level `permissions` block *replaces* the
    # top-level one rather than adding to it, so omitting it would silently drop the read access
    # `actions/checkout` needs — which works on a public repository and breaks the moment one is
    # private, in a job that only runs on a tag.
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile

      # Packs, installs into a clean directory, and runs it. Also the thing that would have caught
      # the 2,693-file tarball: nothing used to clean `dist/`, and `dist/` is gitignored.
      - name: verify the package
        run: bun run verify:package

      # The three places a version lives must agree before anything is published: the tag, the
      # package manifest and `VERSION` in core. `bun run release` writes all three; this refuses a tag
      # that skipped it.
      - name: the tag, the package and VERSION agree
        id: version
        run: |
          pkg=$(node -p "require('./packages/cli/package.json').version")
          core=$(grep -o 'VERSION = "[^"]*"' packages/core/src/version.ts | cut -d'"' -f2)
          if [ "$pkg" != "$core" ]; then
            echo "packages/cli/package.json says $pkg, packages/core/src/version.ts says $core" >&2
            exit 1
          fi
          if [ "${GITHUB_REF}" = "refs/tags/v${pkg}" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=$pkg" >> "$GITHUB_OUTPUT"
            echo "v$pkg"
          else
            echo "tag ${GITHUB_REF_NAME} does not match package version $pkg" >&2
            exit 1
          fi

      # The section this release publishes as its notes. Checked here, before anything is
      # published, because a tag with no notes is refused rather than released with an empty body.
      - name: the changelog has a section for this version
        run: bun scripts/changelog-section.ts "${{ steps.version.outputs.version }}" > /dev/null

      - name: NPM_TOKEN is set
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Nothing was published, and the formula and image depend on the tarball this job publishes. Add the secret and re-run the workflow for this tag."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────────────────
  # The GitHub Release, with the CHANGELOG section as its body. Tag-only.
  release:
    needs: npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: release notes
        run: bun scripts/changelog-section.ts "${{ needs.npm.outputs.version }}" > /tmp/notes.md && cat /tmp/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/notes.md
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────────────────────────
  # The Homebrew formula, committed to the tap.
  #
  # The formula is a URL and a digest of the tarball the registry now serves, so it cannot be written
  # before `npm` has published — and the digest is of the **downloaded** bytes, never of a local
  # rebuild that would hash differently. `moeen-mahmud/homebrew-tap` is a separate repository, and
  # this job commits to it with `TAP_TOKEN`: a fine-grained PAT with contents:write on that one
  # repository. **Absent, the job fails and names the secret** — the previous arrangement attached
  # the formula and printed the manual step, and the tap served 0.1.0 through the whole of 0.1.1.
  formula:
    needs: npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The registry can take a moment to serve a just-published version. Bounded: five minutes,
      # after which the failure names the version rather than hashing a 404 page.
      - name: download the published tarball
        run: |
          version="${{ needs.npm.outputs.version }}"
          for _ in $(seq 1 30); do
            url=$(npm view "dispach@${version}" dist.tarball 2>/dev/null) && [ -n "$url" ] && break
            sleep 10
          done
          [ -n "$url" ] || { echo "::error::dispach@${version} is not on the registry yet"; exit 1; }
          echo "$url"
          curl -fsSL "$url" -o dispach.tgz
          sha256sum dispach.tgz | cut -d' ' -f1 > dispach.sha256
          cat dispach.sha256

      - name: generate
        run: |
          bun scripts/brew-formula.ts --version "${{ needs.npm.outputs.version }}" --sha256 "$(cat dispach.sha256)" > dispach.rb
          ruby -c dispach.rb
          cat dispach.rb

      - name: TAP_TOKEN is set
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN is not set — the formula was generated but not committed to moeen-mahmud/homebrew-tap. Add a fine-grained PAT with contents:write on that repository and re-run this job."
            exit 1
          fi
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

      - uses: actions/checkout@v5
        with:
          repository: moeen-mahmud/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: commit to the tap
        run: |
          version="${{ needs.npm.outputs.version }}"
          mkdir -p tap/Formula
          cp dispach.rb tap/Formula/dispach.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dispach.rb
          if git diff --cached --quiet; then
            echo "the tap already serves ${version}"
          else
            git commit -m "dispach ${version}"
            git push
          fi

  # ─────────────────────────────────────────────────────────────────────────────────────────
  # The image, to GHCR.
  #
  # Two architectures, because the agent container is as likely to land on an arm64 host as an
  # amd64 one and a single-arch image fails at `docker run` with an exec-format error rather than
  # at pull. `docker-compose.yml` pulls `ghcr.io/moeen-mahmud/dispach:${DISPACH_VERSION:-latest}`.
  #
  # Built from the checkout rather than from the published tarball, so a `workflow_dispatch` run can
  # prove the image without a publish — the Dockerfile packs the same tarball `npm` publishes.
  image:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only on a tag; the version tags are what a compose file pins.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
