name: release

# Tag-driven, and the tag is the only trigger. Changesets owns the version number
# (`bun run version:packages` writes it); this workflow turns a tag into artifacts and
# publishes nothing on its own.
on:
  push:
    tags: ["v*"]
  # Buildable without a tag so the matrix can be proven before a release depends on it. A manual
  # run uploads artifacts and touches neither the GitHub release nor the registry.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────────────────
  # The four binaries.
  #
  # Split by *runner* rather than by target, because `codesign` is macOS-only and a darwin binary
  # cross-compiled on Linux cannot be signed on the machine that built it. Bun's own output is
  # already ad-hoc *linker-signed*, which macOS kills on exec — exit 137, no output — so an
  # unsigned darwin asset is a download that fails for every user with no diagnostic at all.
  # `scripts/build-binary.ts` refuses that case rather than producing it.
  #
  # Each leg therefore builds the two targets it can sign, and runs the one it can execute.
  binaries:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            targets: darwin-arm64,darwin-x64
          - runner: ubuntu-latest
            targets: linux-x64,linux-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Required rather than defensive: every sibling package resolves through its `dist/`, so a
      # fresh checkout has nothing for the compile to bundle.
      - name: build
        run: bun run build

      - name: compile
        run: bun run build:binary -- --targets ${{ matrix.targets }}

      # A checksum per asset, written beside it. Not a nicety for a 61-103 MB binary people are
      # asked to put on their PATH.
      - name: checksums
        run: |
          cd dist-bin
          for f in dispach-*; do
            case "$f" in *.sha256) continue ;; esac
            shasum -a 256 "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.runner }}
          path: dist-bin/*
          if-no-files-found: error
          retention-days: 7

  # The Homebrew formula, generated from the digests of the assets that were just published.
  #
  # Generated and *attached*, never committed from here. A tap resolves `Formula/dispach.rb` on the
  # default branch, so the formula has to be committed — but by a person, reviewing the diff, after
  # the release exists. CI pushing to main to update a checksum is a moving part with write access
  # and no reviewer, for a file somebody has to look at anyway.
  #
  # It cannot run before `publish-binaries`, because the digests it embeds must be of the bytes
  # actually attached to the release rather than of a rebuild that would hash differently.
  formula:
    needs: publish-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist-bin

      - name: generate
        run: |
          version="${GITHUB_REF_NAME#v}"
          bun scripts/brew-formula.ts --version "$version" > dispach.rb
          ruby -c dispach.rb
          cat dispach.rb

      - uses: softprops/action-gh-release@v2
        with:
          files: dispach.rb
          fail_on_unmatched_files: true

  # Attach the assets to the GitHub release. Tag-only: a `workflow_dispatch` run stops after the
  # matrix, so the pipeline can be exercised without publishing anything.
  publish-binaries:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist-bin
      - name: what is being published
        run: ls -lh dist-bin
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-bin/*
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────────────────────────────────────────────────
  # The image, to GHCR.
  #
  # Two architectures, because the agent container is as likely to land on an arm64 host as an
  # amd64 one and a single-arch image fails at `docker run` with an exec-format error rather than
  # at pull. `image:` in `docker-compose.yml` already names a tag, so pointing a deployment at
  # GHCR is a one-line change by design.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No floating `:latest` on its own. A tag people copy into a compose file has to pin, or a
      # deployment stops being one the next time this workflow runs.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
