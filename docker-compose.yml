# Dispach as a hosted agent server.
#
#   cp .env.example .env               # then a token and a model key
#   docker compose up -d --wait        # pulls ghcr.io/moeen-mahmud/dispach
#   curl localhost:7420/v1/ready
#   docker compose logs server         # the claim link, for the web UI at localhost:7420
#
# Working from a checkout: `docker compose up -d --build --wait`. **`--build` is then not optional
# after the first run**, and leaving it off is a trap rather than a slow path: `image:` below names
# a tag, compose builds only when that tag is *absent*, so a second `up` reuses whatever was built
# before and reports healthy. Measured — a two-day-old image came up green and served code that
# predated two phases.
#
# At the **repo root** rather than in `docker/`, so `git clone && docker compose up` needs no `-f`.
# The Dockerfile stays where it is; `build.dockerfile` points at it.
#
# Most of what follows is a default that would otherwise bite, so each one says which.

# **The project name, because the default is the directory name.** Compose names a container
# `<project>-<service>-<n>` and takes the project from whatever the checkout happens to be called —
# so this container was `castellan-agent-1` for as long as the directory kept the old name, with no
# brand string anywhere in the tree for `git grep` to find. Set explicitly, it is `dispach-server-1`
# wherever the repository is cloned to.
name: dispach

services:
    # `server`, not `agent`: this hosts zero or more agents and is not one. It comes up with none.
    server:
        # **The published image, pulled; the local build, on request.** `image:` names the GHCR tag
        # and `pull_policy: missing` makes a plain `up` pull it once, so a fresh clone needs no
        # toolchain. `docker compose build` (or `up --build`) still builds from this checkout and
        # tags the result under the same name, which is the developer loop — and is why the trap in
        # the header comment exists: after a local build, a plain `up` reuses it.
        #
        # Pin the version in `.env` (`DISPACH_VERSION=0.1.3`) for a deployment. The default is
        # `latest` only because a compose file people copy has to work before they read it.
        image: ghcr.io/moeen-mahmud/dispach:${DISPACH_VERSION:-latest}
        pull_policy: missing
        build:
            context: .
            dockerfile: docker/Dockerfile

        # **No `command:` here, and that is load-bearing.** The image's CMD carries
        # `--host 0.0.0.0`; a compose `command:` replaces CMD wholesale, so adding one — even to
        # "just pass the manifest path" — silently drops the host flag. The process then listens on
        # loopback inside the container, which no published port can reach: a container that builds,
        # starts, reports healthy and answers nothing.

        # Likewise **no `healthcheck:`**. The image defines one against `/v1/ready`; restating it
        # here gives two definitions to keep in step, and the one in the compose file wins.

        ports:
            # Host side is configurable because 7420 is often already taken by a `serve` running
            # outside Docker. Container side never moves — the healthcheck inside the image polls
            # 127.0.0.1:7420 and knows nothing about this mapping.
            - "${HOST_PORT:-7420}:7420"

        environment:
            # **The only required variable.** `:?` fails at `up` time with this message rather than
            # letting the container start and refuse. Both refusals are correct; only one of them is
            # visible without reading logs.
            DISPACH_API_TOKEN: ${DISPACH_API_TOKEN:?set DISPACH_API_TOKEN in .env — the image binds 0.0.0.0 and refuses to serve the world unauthenticated}

            # **A model key is deliberately NOT required here.** This comes up with zero agents, so
            # there is nothing for a model key to configure — demanding three of them to start a
            # server that hosts nothing is friction for a state the server is designed to be in.
            # They belong to the mounted-agent shape below and are commented out with it.

        volumes:
            # **The agent's home, and the only volume.** It was `/state` with `DISPACH_HOME`
            # pointing at it, which produced two disjoint agents directories: `init` wrote to
            # `/state/agents` while the CMD served `/agent`, so an agent created inside the
            # container was invisible to every listing and nothing would ever serve it. The image
            # sets no `DISPACH_HOME` at all now — `HOME` decides, so the paths are a laptop's:
            # `~/.dispach/store.db`, `~/.dispach/agents/`, `~/.dispach/logs/`.
            #
            # A **named** volume, which is the whole reason the most common first-run failure is
            # unreachable here: a named volume inherits uid 1000 from the image, while a host path
            # keeps host ownership and a non-root container cannot write its own home. Swap this for
            # a bind mount and `chown 1000:1000` it first.
            #
            # It now also holds the `uv` cache and the cloned skills catalogues, which used to sit on
            # a tmpfs and be thrown away on every restart.
            - dispach-home:/home/dispach

            # ─── Mounting an agent from the host: opt in ─────────────────────────────────
            #
            # **Nothing is mounted by default, and that is the fix for a real defect.** This line
            # used to read `"${AGENT_DIR:-./examples/minimal}:/agent"`, so `docker compose up` on a
            # fresh clone silently hosted the repository's *example* agent — a container advertised
            # as a server arrived with somebody else's assistant already answering on it. A sample
            # is a thing you ask for, never a thing you get.
            #
            # With no mount the server comes up hosting nothing, which is the supported state: the
            # API and the web UI are there first, and an agent is created through them or with
            # `docker compose exec server dispach init`. The entrypoint's symlink is guarded on
            # `/agent/agent.yaml` existing, so it makes no link and `~/.dispach/agents/` stays empty.
            #
            # Uncomment both halves together — the mount and the model variables it needs. The model
            # goes through the *environment* rather than a `.env` beside the manifest because the
            # ambient environment deliberately beats the agent's own file: an operator has to be
            # able to configure the agent their container runs.
            #
            # Read-write, not `:ro` — the skills cache writes to `<agentDir>/.dispach/` and
            # `memory_write` appends to the workspace files beside the manifest.
            #
            # - "${AGENT_DIR:-./examples/minimal}:/agent"
            #
            #   environment:
            #       MODEL_ID: ${MODEL_ID:?set MODEL_ID in .env}
            #       MODEL_BASE_URL: ${MODEL_BASE_URL:?set MODEL_BASE_URL in .env}
            #       MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY in .env}

        # ─── Containment ──────────────────────────────────────────────────────────────────
        #
        # The agent has a **shell**. `tools.policy` decides whether a command runs; this decides
        # where it runs and what it can reach, and the two are different mechanisms — the policy
        # ships with the runtime, containment is a deployment concern and stays one. This is that
        # concern, answered.
        #
        # Nothing here is optional decoration. A `--system full` agent can be talked into running
        # a command by the page it is reading, and the write gate is the thing that holds rather
        # than the delimiters around untrusted text.

        # `exec` backgrounds children on purpose, and a backgrounded child whose parent is PID 1
        # has nothing to reap it. Without an init, zombies accumulate — 33 unreaped shells once
        # took a machine to load average 351 and a 132 s boot, with nothing obviously wrong.
        init: true

        # Every capability dropped. The process is already uid 1000 and binds 7420, which is above
        # 1024 and therefore needs no `CAP_NET_BIND_SERVICE`. Nothing else in the runtime asks for
        # a capability, so an empty set is not a compromise — it is the true requirement.
        cap_drop:
            - ALL

        # A setuid binary inside the image cannot raise privileges. There should be none; this is
        # what makes that a property rather than an audit.
        security_opt:
            - no-new-privileges:true

        # **A fork bomb is one `exec` call away**, and `init: true` reaps children rather than
        # bounding them. 512 is far above what a real turn needs — `limits.maxParallelTools` and
        # the eight-child backgrounding cap bound the runtime's own use — and far below what it
        # takes to make a host unusable.
        pids_limit: 512

        # Bounded, for the same reason. An agent asked to "process this large file" can allocate
        # until the host swaps; here it is OOM-killed and restarts, which is legible. Raise it if
        # a real workload needs more — it is a ceiling, not a target.
        mem_limit: 2g
        cpus: 2.0

        # **A read-only root filesystem**, with writable scratch where things genuinely write.
        #
        # `/agent` and `/home/dispach` are mounts and stay writable — the skills cache writes to
        # `<agentDir>/.dispach/` and `memory_write` appends beside the manifest. Everything else
        # is immutable, so a shell cannot leave anything behind that survives a restart.
        #
        # **One tmpfs now, not two.** `/tmp` stays because `exec` hands children a file descriptor
        # there rather than buffering their output. The second entry was `/home/bun`, and it existed
        # only because the home directory was not a real one: `uv` materialises its cache under
        # `$HOME`, so a tmpfs meant a cold Python environment on every boot and a re-clone of ~22 MB
        # of skills catalogues. `$HOME` is a volume now, so the trade is gone rather than accepted.
        read_only: true
        tmpfs:
            - /tmp:size=256m,mode=1777

        # Compose's default is 10 s, which can SIGKILL an outbox flush mid-write. Exactly-once is
        # held per crash point rather than claimed outright, and the window a hard kill lands in is
        # the one `delivery.uncertain` exists to make explicable afterwards. 30 s is the graceful
        # path having room to run `runtime.stop()`.
        stop_grace_period: 30s

        restart: unless-stopped

        # Bounded, because the default json-file driver has no limit and a poll loop that reports a
        # fault every few seconds fills a disk. The runtime this replaces wrote 57 MB of one
        # sentence into a log nobody had been told about.
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # **A second agent needs no second service.** One process hosts N agents (decision 8.5) and
    # `serve` with no manifest hosts every enabled agent in the sandbox — so a second agent is
    # `dispach init` inside this container, and the running server adopts it with no restart.
    #
    # A second *container* is for isolation rather than for capacity: a shared process means one
    # agent's runaway `exec` starves the others. If that is what you want, it needs its own port
    # and **its own home volume** — two containers sharing one would share a `store.db` whose rows
    # are keyed by agent id, and reconciliation ends with `removeManifestExcept`, so each boot
    # would delete the other's schedules and report success.
    #
    # server-two:
    #     image: ghcr.io/moeen-mahmud/dispach:${DISPACH_VERSION:-latest}
    #     ports:
    #         - "7421:7420"
    #     environment:
    #         DISPACH_API_TOKEN: ${DISPACH_API_TOKEN:?}
    #     volumes:
    #         - dispach-home-two:/home/dispach
    #     init: true
    #     stop_grace_period: 30s

volumes:
    dispach-home:
    # dispach-home-two:
