# The reference manifest: every field `agent.yaml` accepts, in one place.
#
# Runnable as it stands. Everything a phase has not delivered yet is present but commented, with
# the phase that unlocks it — so completing a phase means uncommenting a block here and watching it
# work, rather than discovering the field name in a spec.
#
# The commenting is not cosmetic. A section this build does not implement is **refused at load**,
# naming the phase, rather than parsed and ignored: a runtime that silently drops configuration
# lies about what it is doing. Uncomment `schedules` today and the load fails on purpose.
#
# `docs/02-SPEC-MANIFEST.md` is the binding reference. This file is the worked copy.

apiVersion: dispach/v1
id: reference
name: Milo (Reference Assistant)

# Path to a base manifest. Shallow merge; arrays replace rather than concatenate.
# extends: ./base.agent.yaml

# ── model ─────────────────────────────────────────────────────────────────────────────────
# Three roles. `main` is required; `selector` and `compactor` fall back to it.
model:
  main:
    # Sent verbatim as the `model` parameter. Literal, not ${MODEL_ID}: which model an agent runs
    # on is not a secret, and putting it behind a variable cost more than it bought — the sandbox
    # picker listed every agent as "${MODEL_ID}" (headers are read WITHOUT expansion, on purpose),
    # any .env on the machine could change it, and with it the resolved window, thinking mode and
    # promptStyle. ${VAR} still expands here for anyone who wants it; it is not the default.
    id: deepseek-v4-pro
    # Must end at the version segment. The runtime appends `/chat/completions`.
    baseUrl: https://api.deepseek.com/v1
    # The *name* of an env var. A literal key here fails validation — rule 2.
    apiKeyEnv: MODEL_API_KEY
    temperature: 0.3

    # How much the model may deliberate before answering. Sent as OpenAI's `reasoning_effort`,
    # omitted entirely when unset. Worth setting to `none` on a reasoning model doing short,
    # well-specified work: measured on qwen3.5:9b, six simultaneous rules with reasoning on burned
    # 2000 output tokens in 104s and returned EMPTY content, while `none` answered in 2.1s.
    # Not every endpoint honours it, and one that ignores it says nothing — verify per endpoint.
    # reasoningEffort: none      # none | minimal | low | medium | high
    # topP: 0.95
    # maxTokens: 4096
    # headers:
    #   x-my-gateway-tenant: ${TENANT_ID}

    # `stream_options: {include_usage: true}` — an OpenAI extension, so off by default because an
    # endpoint that does not know it may reject the whole request. Measured: Ollama reports no usage
    # without it, so local token counts come from the estimator until this is set. Turn it on when a
    # token figure is being compared rather than displayed.
    # streamUsage: true      # on by default now; set false to stop asking for stream_options

    # Override the shipped capability registry only when it is wrong for your endpoint. These affect
    # thinking-block replay and cache-breakpoint placement, and never the tool dialect.
    # capabilities:
    #   nativeTools: true
    #   strictSchema: false
    #   # none | anthropic | openai | deepseek — what the loop must *do* with reasoning, not
    #   # whether the model reasons. `deepseek` bills reasoning to the output budget, so
    #   # reserveOutput must cover thinking *plus* the answer.
    #   thinking: deepseek
    #   promptCache: none
    #   parallelToolCalls: false
    #   contextWindow: 32768
    #   maxOutput: 8192
    #   # Phase 3.5 — how authored workspace files are rendered for this model.
    #   promptStyle:
    #     delimiters: plain     # xml | markdown | plain
    #     intensity: emphatic   # emphatic | neutral | soft
    #     examplesIn: system    # system | user
    #     skillsIn: system      # system | user

  # A cheap model for tool selection and summarisation. `$ref` reuses a role without repeating it.
  # selector:
  #   id: ${SELECTOR_MODEL_ID}
  #   baseUrl: ${MODEL_BASE_URL}
  #   apiKeyEnv: MODEL_API_KEY
  # compactor: { $ref: model.selector }

# ── context ───────────────────────────────────────────────────────────────────────────────
context:
  # Defaults to the model's `contextWindow` capability. Set it to spend less than the window.
  # window: 32768

  # Held back for the reply. Generous on purpose: a reasoning model bills its thinking here too,
  # and too small a reserve returns empty content with finish_reason=length.
  reserveOutput: 8192

  # Above this, one tool observation is cut to head+tail with the removed size named.
  observationMaxTokens: 2000

  # ── The tiered workspace (Phase 3.5) ──
  # This replaces the flat `context.files` list, which remains as a deprecated alias and warns at
  # load. A flat array cannot say which files are cache-stable, which sit after the conversation
  # history, or which the agent may write to — and each of those has a measured cost when got
  # wrong. See docs/07-SPEC-WORKSPACE.md.

  # Where the tier lists resolve from. This example keeps its files beside the manifest; a real
  # agent usually points this at ./workspace — see examples/workspace-template.
  workspace: .

  # Tier 0 — slot 0, before cache breakpoint A, read-only. Byte-stable across turns, or prompt
  # caching stops working with no error anywhere.
  #
  # This example takes its identity from `soul` below — the selected file (full or compact)
  # loads first in this tier automatically, and listing a second identity document would ship
  # two contradicting ones. AGENTS.md is not identity: it is operations — what Milo does and
  # how, per decision 11.19 — which is why the two coexist.
  static:
    - AGENTS.md

  # Tier 1 — slot 3, AFTER the breakpoint, so a memory write leaves the cached prefix untouched.
  # `memory_write` lands in whichever file here declares `eviction: oldest`, falling back to the
  # first writable one in declared order. The declaration is what names the target: USER.md is
  # writable and comes first, but it is a person's prose with no intention of being trimmed, and
  # under plain declared order every saved note went there until it burst its own budget.
  # volatile:
  #   - USER.md
  #   - MEMORY.md

  # Tier 2 — slot 9, after the conversation history and before the current input. One or two
  # rules, re-asserted because adherence decays and attention is weakest in the middle.
  # reminder: REMINDER.md

  # ── Phase 7A: the compaction ladder ──
  # Trigger fractions, strictly ascending, validated at load — and fractions of the PROMPT BUDGET
  # (window minus reserveOutput), not of the whole window. Measured against the window, a large
  # reserveOutput lets assembleContext's blunt oldest-first trim run while the ladder still reports
  # mild pressure, which is the common case on a reasoning model.
  # snip cuts oversized tool results to head and tail · micro replaces one with a pointer
  # artifact_read follows · collapse digests all but the newest turns · reset digests everything ·
  # trim drops what the digests declined to summarise. Mechanical below collapse: no model call
  # happens under 0.80, and a compactor that is absent, throws, or returns nothing falls back to a
  # factual digest.
  # Ordered by information DESTROYED, not bytes freed — snip and micro leave a pointer, collapse and
  # reset leave meaning, trim leaves nothing. Measured: tool results were 84% of history bytes on a
  # real session and everything the person had typed was 0.3%, so observations go first and no stage
  # drops a request. And summarising must precede destroying: with trim third, collapse and reset
  # could never fire, because a digest plus the preserved requests is never smaller than the
  # requests alone.
  # Each stage aims at the threshold one rung BELOW the deepest that fired. That is where the
  # hysteresis comes from — aiming just under the trigger lands on it and fires again next turn.
  thresholds:
    snip: 0.60
    micro: 0.70
    collapse: 0.80
    reset: 0.88
    trim: 0.95

  budgets:
    static: 2000
    volatile: 5500
    reminder: 500
    total: 8000                # hard cap. Over budget fails the load naming the file.
  # Imperative count across static + reminder, against what the target affords. The runtime
  # computes the allowance rather than trusting a table — the arithmetic is unintuitive and
  # authors consistently overestimate it.
  rules:
    perRuleSuccess: 0.90        # measure it with `eval rules`, do not guess
    reliabilityTarget: 0.80     # at 0.90 per rule this permits TWO rules, not four
    onExceed: fail              # fail | warn
  # ── Phase 3.5: capability-gated long-form identity ──
  # SOUL.md ships only to a model meeting `requires`; anything else gets the hand-edited
  # compact file. `soul distill SOUL.md` scaffolds it — headings and <rules> survive verbatim,
  # prose becomes placeholders a person fills. Distillation is never automatic: a summariser
  # drops exactly the parts that produce voice.
  soul:
    file: SOUL.md
    requires: { contextWindow: ">=200000", class: frontier }
    onUnmet: distill             # distill | omit | fail
    distilled: SOUL.compact.md   # required by distill; its absence is a load failure
  # ── Phase 7A ──
  # Generated, never authored: the thresholds are manifest values and an authored sentence about
  # them goes stale silently. It exists to stop the model wrapping up early — a model that senses
  # the window filling shortens its work and does not say why.
  compactionNotice: true

# ── tools ─────────────────────────────────────────────────────────────────────────────────
tools:
  # Config only, never auto-detected: behaviour must not drift when the model changes. `nlt` is
  # the default on measured evidence — see evals/tools/README.md.
  dialect: nlt

  # Built-in tools, resolved from memory. Never sent to a remote provider.
  local:
    - now             # read-only: runs in parallel with other reads
    - memory_write    # mutating: serialises, holds a reserved write slot, never retried
    - artifact_read   # follows the pointer compaction leaves behind; without it the detail is gone

  budget:
    max: 24
    # Slots held for mutating tools so a large read surface cannot starve the writes.
    reserveWrite: 6

  # ── Providers: where tools come from ──
  # A MAP, not a choice. `system`, `web` and `composio` are not alternatives — an agent that runs
  # commands and reads the web wants both — and the scalar `tools.provider` this replaced could hold
  # only one. That field still loads and warns; setting both is refused rather than merged, because
  # the scalar has no position in the map and provider order decides a slug collision.
  #
  # Nothing is implied by registering a provider: naming it here AND pinning the tool are both
  # required, the same way tools.local is opt-in. Each block is that provider's own configuration and
  # each refuses a key it does not read.
  #
  # providers:
  #
  #   # @dispach/tools-system — shell and files.
  #   #
  #   # `exec` takes command, workdir, timeoutMs, pty and background. It takes no `env` argument on
  #   # purpose: a per-call environment map is invisible to the policy rules, which match the command
  #   # string, so `PATH=/tmp/evil` beside `git status` would pass a rule that never saw it. Written
  #   # inline it is part of the command and the rule does not match. The ambient environment IS
  #   # inherited, including this agent's .env — a pinned `exec` can read every secret the agent can.
  #   system:
  #     writeRoots:       # extra directories the file tools may write to
  #       - ~/code/thing  #   absolute, or relative to this file
  #     protect:          # extra paths they refuse. Widening only — nothing removes a protection
  #       - "*.pem"
  #
  #   # @dispach/tools-web — the public internet, read-only.
  #   #
  #   # `web_search` returns results and needs a key; `web_fetch` returns one page as text and needs
  #   # nothing. Both are trust: untrusted — their output is text a stranger wrote, so it is delimited
  #   # as data and cannot silently drive a mutating tool in the same turn.
  #   #
  #   # Loopback, link-local, private and CGNAT addresses are refused outright, at every redirect hop,
  #   # and there is deliberately NO setting that permits them: the one real use of such a flag is
  #   # reaching the cloud metadata endpoint. An operator who wants an internal HTTP call has `exec`
  #   # and `curl`, which is a grant made deliberately and narrowable by a policy rule.
  #   web:
  #     backend: tavily              # tavily | brave | exa
  #     apiKeyEnv: TAVILY_API_KEY    # the variable's name, never the key
  #     maxBytes: 2000000            # stop reading a page here, mid-response, before extraction
  #
  #   # @dispach/tools-composio — a remote catalogue, called over HTTP and never through MCP.
  #   #
  #   # Three meta tools resolve from this provider with no cache and no request, so an agent can
  #   # reach a new app without anyone opening a dashboard:
  #   #   composio_search      finds the tools for a task and caches their real schemas
  #   #   composio_connect     returns the sign-in link for an account
  #   #   composio_workbench   runs Python in Composio's sandbox — under no rule written here
  #   #
  #   # The flow is search -> connect -> pin -> restart. A slug the agent finds is written into
  #   # tools.pinned with config_set and is an ordinary pinned tool on the next start. Nothing
  #   # executes an arbitrary discovered slug: that would make every task two-hop, which is what
  #   # pinning at load exists to avoid.
  #   #
  #   # A slug typed in by hand still needs `dispach tools ./agent.yaml --warm` first: resolution
  #   # happens during boot where no network call is permitted, so an unwarmed slug fails the load.
  #   composio:
  #     apiKeyEnv: COMPOSIO_API_KEY
  #     userId: me
  #
  # pinned:
  #   - file_read      # untrusted: a file on disk may have been downloaded a minute ago
  #   - glob           # find files by name — * stays in one directory, ** crosses them
  #   - grep           # find lines by regex, with an optional file glob
  #   - file_write     # trusted output: it reports what it wrote, never the content
  #   - file_edit      # exact unique match, never a line number; two matches is a failure
  #   - exec           # the last resort — its target is a string no rule can look inside
  #   - config_read    # read this file and tell the person which setting to change
  #   - config_set     # change this file when asked. Refuses the three edits that only ever
  #                    #   remove a check: widening writeRoots, replacing policy.deny, and
  #                    #   setting untrusted.onMutate to allow
  #   - web_search
  #   - web_fetch
  #   - GMAIL_FETCH_EMAILS
  #
  # Writes are confined to workspace/ — everything else is read-only until writeRoots says otherwise.
  # On top of that the file tools refuse this manifest, SOUL.md, AGENTS.md, POLICY.md, and anything
  # under .ssh/.aws/.kube, and no allow rule reaches past that. USER.md and MEMORY.md stay writable:
  # they are the tier memory_write appends to.
  #
  # NEITHER confinement binds `exec`: a shell carries its target inside a string no path check can
  # look inside. "Only inside workspace/" is a true statement only for an agent with no shell — which
  # is what `dispach init --system write` generates. And no amount of SSRF checking in `web_fetch`
  # changes what a policy that allows `exec` allows: `curl` is in there too.

  # ── tools.search is about finding a TOOL, not searching the web ──
  # This exposes a meta-tool that searches the *provider's catalogue* — 25,438 tools, in Composio's
  # case — so the model can discover a tool it was not given. Off by design in v1 and refused if
  # enabled: search-then-execute is two-hop reasoning, which is exactly where small models fail. Pin
  # what the agent needs instead.
  #
  # If you want the agent to search the *internet*, that is `web_search` above. Nothing to do with
  # this field.
  search:
    enabled: false

  # ── Which calls run, which ask, and which are refused ──
  # A second layer under pinning, for tools too broad to authorise wholesale — `exec` above all.
  # Evaluation is deny → allow, first match, and specificity never reorders it, so a deny rule
  # carries no exceptions. A rule naming a primary content field — exec(command:rm *) — is refused
  # at load: a compound command defeats it, and a rule that can be defeated reads as protection.
  #
  # A handful of commands are refused below every one of these settings and cannot be re-enabled:
  # `rm -rf /` and `rm -rf ~`, --no-preserve-root, fork bombs, mkfs, dd to a block device.
  policy:
    # allow | ask | deny — what happens to a call no rule mentions. `allow` because pinning is the
    # primary authorisation here: this agent has exactly the tools listed above. `ask` on an
    # unattended run means onNoApprover answers it, and a scheduled agent would do nothing at all.
    mode: allow
    allow: []
    deny: []
    # What `ask` means with nobody to ask — a schedule, a pipe, a channel with no approver.
    onNoApprover: deny

  # What to do when untrusted output is in the turn and the model asks for a mutating tool.
  # `refuse` is the default: the call is blocked and the model is told to ask the person instead.
  # `confirm` asks when someone is reachable and refuses when nobody is.
  untrusted:
    onMutate: refuse             # refuse | confirm | allow

  # A tainted mutating call needs EXPLICIT authorisation — a policy.allow rule you wrote, or a live
  # approval you gave. `mode: allow` is the absence of a rule, not one, so it does not satisfy this.
  #
  # The consequence worth knowing before you pin `exec`: its own output is untrusted (curl is the
  # internet), so its first call taints the turn and its second is refused. That is the gate working,
  # and the load says so by name rather than letting you find out mid-turn. The fix is one line —
  #
  #   policy:
  #     allow: ["exec"]              # or narrower: "exec(git *)", "exec(npm test:*)"
  #
  # — or `onMutate: confirm` to be asked each time.

# ── limits ────────────────────────────────────────────────────────────────────────────────
limits:
  # Steps per turn before forced termination, reported as `reason: max_steps`. Generous, because a
  # step budget is not a plan: real work recovers — a mangled command becomes a script file, a
  # missing library gets installed, a failed test gets read. Sizing this for the shortest successful
  # path is what cut an agent off one step after it installed the dependency it needed.
  maxSteps: 40
  # What actually catches a stuck model. Identical consecutive calls — same tool AND same arguments —
  # end the turn as `no_progress`. Two is a retry, which is often right. Three is a pattern.
  noProgress:
    identicalCalls: 3
  # Must exceed any upstream timeout on the model endpoint.
  turnTimeoutMs: 1800000
  toolTimeoutMs: 120000
  # Read-only tools only. Mutating tools always serialize, whatever this says.
  maxParallelTools: 4

# ── Phase 7B: phase-scoped tool visibility ────────────────────────────────────────────────
# The strongest published small-model lever: constraining the tool space per phase took local
# models from 2/10 to 10/10 on a benchmark subset with no model change. Measure it for your own
# endpoint with `bun run eval:phases` — see evals/phases/README.md for what the number does and
# does not say.
#
# An `allow` entry is a slug, a `tag:<name>` from the tool's own spec, or `*`. Nothing else: a
# pattern language here would be a second matcher beside tools.policy's, and the two disagreeing
# about what `exec*` means is worse than not supporting it. An entry matching no resolved tool
# FAILS THE LOAD, because a phase that silently exposes less than its author wrote shows up turns
# later as the agent declining work it should be able to do.
#
# `phase_set` is added to every phase automatically — a phase without it would be a phase with no
# way out, and leaving that to authors to remember is a trap in the file format. The current phase
# is named in that tool's description rather than in slot 2: a phase is per session and changes
# mid-turn, while slot 2 is frozen per agent because it sits in the cache-stable prefix.
#
# The cost, stated: changing phase re-renders slot 1, so the cached prefix is invalidated from
# slot 1 onward for that one request. Accepted deliberately — triage → phase_set → write inside
# ONE turn is the whole feature, and deferring it to the next turn recreates the two-hop shape
# decision 4.7 refuses, in the feature that exists for the models which fail it.
phases:
  triage:
    entry: true                    # defaults to the first declared phase
    allow: ["now", "tag:read"]     # slugs, `tag:<name>`, or `*`
  act:
    allow: ["*"]

# ── Phase 5: skills ───────────────────────────────────────────────────────────────────────
# A skill is a directory holding SKILL.md, selected by the harness on the turn that needs it and
# injected for that turn only. agentskills.io frontmatter: name and description required, plus
# license, compatibility, metadata and allowed-tools. Negative routing guidance goes under
# metadata as <brand>-when-not-to-use — the spec defines no field for it — and is warned about
# rather than required. allowed-tools is displayed and never honoured.
#
skills:
  dir: ./skills
  maxActive: 1
  threshold: 0.35        # normalised BM25 floor; the shipped fixtures score 0.369–0.600
  # No `budget` field, and it was removed rather than never added. A token cap refused at install,
  # at load *and* mid-turn, and its first real use turned eleven ticked skills into nine installed —
  # `maxActive` already bounds a turn to one body, so the second limit only ever converted the right
  # procedure into no procedure. The replacement is showing the size where the choice is made:
  # every catalogue row prints its token count.
  # No `sources` field. Where skills come from is the person's, machine-level, and the CLI's:
  #   sources list | add <url> | search <words>   →  ~/.<stateDir>/sources.json
  #   skills install <agent> anthropic/pdf        →  provenance in ./skills/.origins.json
  # A fetchable URL in this file would be an invitation to resolve it at boot. See decision 11.46.

# ── Phase 3.5: knowledge — Tier 3, retrieved and never pinned ─────────────────────────────
# Entries activate when the current input mentions one of their frontmatter keywords, at most
# maxActive per turn and at most budget tokens between them. An entry over the whole budget
# fails the load — it could never activate, and silently unreachable is the one wrong answer.
knowledge:
  dir: ./knowledge
  maxActive: 2
  budget: 600

# ── Phase 6: memory ───────────────────────────────────────────────────────────────────────
# Two tiers, one writer. `memory_write` appends to the *carried* file — the workspace write target,
# in the volatile tier, present in slot 4 every turn — and when that file passes its budget the
# oldest notes move into `dir`, where only retrieval reaches them. So a fact said a minute ago is
# still carried, one from June is found by searching, and nothing is deleted at either step.
#
# FTS5 over the notes, no embedding model and no network. The index is a *candidate filter*: scoring
# is the same BM25 `skills` uses, which is why `threshold` here and `skills.threshold` are on one
# comparable scale. Omit the whole block to switch memory off; `memory: {}` is enough to turn it on.
memory:
  retriever: fts5
  # Relative to this file. Monthly `YYYY-MM.md`, written by eviction, read by retrieval.
  dir: ./memory
  # Passages injected into slot 7 in one turn. 0 keeps `memory search` working with no injection.
  # Five since conversations are indexed as well as notes: a corpus holding both answers "where did
  # we get to" from several passages, and three is one exchange plus two notes that share its words.
  maxActive: 5
  # LOWER than skills' 0.35 on purpose: a wrong skill displaces the right one, an extra remembered
  # note costs ~20 tokens. Measured — a note matching two of a query's three informative terms
  # scores 0.284, which 0.35 would withhold and which is a good answer.
  threshold: 0.2
  # Total across injected passages. Outside the workspace cap: this tier is retrieved, not carried.
  # Raised from 600 when includeHistory was implemented, and required rather than generous: 600 was
  # sized for one-line notes, and an exchange is a question plus a reply — capped at 600 characters a
  # side, so a full one bills near 370 tokens. Two would have exhausted the old budget. A ceiling,
  # not a target; and selectPassages STOPS at the first passage that does not fit rather than
  # skipping it, so an undersized budget lets one big exchange block everything ranked below it.
  budget: 2000
  # Index the person's messages and the agent's replies too, so a session nobody wrote a note in is
  # still answerable later. Only messages the *runtime* did not author are indexed — `origin` marks
  # observations, calls, repairs and digests, and the filter is an allowlist of prose rather than a
  # blocklist of those four, so a fifth kind added later is excluded by default. Tool observations
  # are therefore NEVER indexed at any setting: that is where untrusted text lives, and indexing it
  # would make an injection durable across sessions, long after the write gate that fenced it
  # stopped applying. Conversations are indexed at turn end and reconciled separately from the
  # files — `memory rebuild` restores both, because clearing the index clears both.
  includeHistory: true

# ── Phase 4: channels, delivery, and the HTTP server ──────────────────────────────────────
# `allowFrom` is **inbound-only**, and omitting it permits nobody. It confers nothing on outbound
# delivery, and conflating the two produces a confusing "chat not found" class of failure.
# Matching folds case, treats a leading `@` as optional, and checks the handle *and* the numeric
# peer id — a Telegram user with no username has only the latter. `["*"]` permits anyone.
#
# Channels connect **after** `runtime.ready`, never before, and a channel that cannot connect never
# blocks readiness: it reports `agent.channel.error` and the process keeps serving. Only
# `dispach serve` starts them — `run` builds the same runtime with them switched off.
# `enabled: false` here only so this file stays runnable with no bot token — a *disabled* channel
# is never constructed, so its factory never asks for one. Set TELEGRAM_BOT_TOKEN and flip it.
channels:
  - type: telegram
    id: tg                         # the channel segment of every session key it produces
    enabled: false
    mode: longpoll                 # or webhook; channel-specific fields reach the plugin's schema
    tokenEnv: TELEGRAM_BOT_TOKEN
    allowFrom: ["@moeen"]
    # webhookUrl: https://agent.example.com/v1/channels/tg/webhook/reference
    # secretTokenEnv: TELEGRAM_WEBHOOK_SECRET   # naming it and leaving it unset is refused
  # WhatsApp is Phase 4's non-goal — the type is not registered, so this would fail at load.
  # - type: whatsapp
  #   id: wa
  #   authDir: ./.dispach/wa-auth

# A delivery target names a channel's **id**, not its type. Checked at load rather than at the
# first scheduled run, which is otherwise where it surfaces.
delivery:
  default: tg                      # used when a turn has no origin — a schedule, or the API
  targets:
    owner: { channel: tg, to: "@moeen" }

server:
  enabled: true
  host: 127.0.0.1                  # a non-loopback bind refuses to start without a token
  port: 7420
  tokenEnv: DISPACH_API_TOKEN

# ── Phase 8: schedules ────────────────────────────────────────────────────────────────────
# Validated at write time rather than fire time. `deliver` is required — `{channel,to}` or the
# literal "none" to return results through the event stream only.
#
# schedules:
#   - id: morning-brief
#     kind: cron                   # cron | every | at
#     expr: "0 8 * * *"            # cron: 5 or 6 field · every: "15m" · at: ISO 8601, max +10y
#     task: "Summarise today's calendar and unread email."
#     deliver: { channel: tg, to: "@moeen" }
#     session: isolated            # or `shared:<key>`
#     enabled: true
#     timezone: Asia/Dhaka         # IANA name; defaults to TZ, then UTC

# ── Phase 9: plugins ──────────────────────────────────────────────────────────────────────
# Trusted in-process code, documented as such. Resolved at boot from this list; never installed
