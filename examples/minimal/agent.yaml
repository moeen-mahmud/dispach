# The smallest useful manifest: one model, one identity file, no tools or channels.
#
# Everything endpoint-specific comes from the environment, so this one file works unchanged
# against OpenAI, an Anthropic-compatible base URL, and any host serving open weights — which is
# the point. See README.md in this directory for the env presets.
apiVersion: dispach/v1
id: minimal
name: Vela (Minimal Assistant)

model:
  main:
    # ${VAR} here, and this example is the exception that shows when it is right.
    #
    # The general rule — and what `init` generates — is a literal id: a model name is not a secret,
    # and behind a variable it breaks the sandbox picker (headers are read unexpanded), lets any
    # .env on the machine change the resolved window and promptStyle, and makes `validate` check
    # whichever agent the environment described. See examples/reference/agent.yaml.
    #
    # This file's entire purpose is the opposite claim: the SAME manifest against four endpoints,
    # which is what the Phase 1 acceptance criteria check. So the variables stay, deliberately, and
    # the endpoint table below is the reason.
    id: ${MODEL_ID}
    baseUrl: ${MODEL_BASE_URL}
    # The *name* of an env var. A literal key here fails validation.
    apiKeyEnv: MODEL_API_KEY
    temperature: 0.3

context:
  # The workspace directory the tier lists resolve against. This example keeps its files beside
  # the manifest rather than in a ./workspace subdirectory, so it is the manifest's own directory.
  workspace: .

  # Tier 0 — pinned in slot 0, before cache breakpoint A, read-only to the agent.
  # Order matters: earlier instructions are favoured under moderate instruction density.
  # The identity file is listed directly — the `context.soul` capability gate is optional
  # machinery, and the smallest working shape skips it.
  static:
    - SOUL.md
  # Held back from the window for the reply. Generous because a reasoning model bills its
  # thinking to this same budget: too small and the answer comes back empty with
  # finish_reason=length, which the runtime reports as a failure rather than a blank reply.
  reserveOutput: 8192

limits:
  # Small on purpose, and the only manifest here where that is right: this example exists to be run
  # against four endpoints in a few seconds, not to do work. Anything that does work wants the
  # default of 40 — a six-step budget cut a real agent off one step after it had installed the
  # dependency it needed. `noProgress`, not this, is what stops a stuck model.
  maxSteps: 4
  turnTimeoutMs: 120000
